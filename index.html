<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daily Checklist</title>
<style>
  :root { --bg:#f6f6f3; --card:#fff; --text:#222; --muted:#888; --accent:#2f7d5b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --card:#222; --text:#eee; --muted:#999; --accent:#5fc595; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0; font-size:26px; }
  #date, #progress { color:var(--muted); margin:4px 0 16px; }
  ul { list-style:none; padding:0; margin:0 0 16px; }
  li { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:12px; padding:14px; margin-bottom:8px; }
  li label { flex:1; display:flex; gap:12px; align-items:center; cursor:pointer; }
  li input { width:22px; height:22px; accent-color:var(--accent); }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li button { background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; }
  form { display:flex; gap:8px; }
  form input { flex:1; min-width:0; padding:12px; border-radius:10px; border:1px solid var(--muted); background:var(--card); color:var(--text); font-size:16px; }
  form button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; }
  #sync { margin-top:32px; padding-top:16px; border-top:1px solid color-mix(in srgb, var(--muted) 40%, transparent); font-size:14px; color:var(--muted); }
  #sync p { margin:0 0 8px; }
  [hidden] { display:none !important; }
  #ptr { height:0; overflow:hidden; display:flex; justify-content:center; align-items:center; transition:height .2s; }
  #ptr .spin { width:24px; height:24px; border:3px solid var(--muted); border-top-color:var(--accent); border-radius:50%; }
  #ptr.loading .spin { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .link { background:none; border:0; padding:0; color:var(--accent); font-size:14px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div id="ptr" aria-hidden="true"><div class="spin"></div></div>
<main>
  <h1>Today</h1>
  <p id="date"></p>
  <ul id="list"></ul>
  <p id="progress"></p>
  <form id="add">
    <input id="name" placeholder="Add a daily task…" aria-label="New task" required>
    <button>Add</button>
  </form>

  <section id="sync">
    <p id="sync-status"></p>
    <form id="connect">
      <input id="token" type="password" autocomplete="off" placeholder="Paste your GitHub key" aria-label="GitHub key">
      <button>Connect</button>
    </form>
    <button id="disconnect" class="link">Turn off sync on this device</button>
    <p style="margin-top:12px">App version <span id="ver"></span> · pull down to check for changes</p>
  </section>
</main>
<script>
  const VERSION = 5; // bump on every release so installed copies update themselves
  const FILE = 'daily-checklist.json', API = 'https://api.github.com';

  // Home Screen apps can keep an old copy of this page for a long time. Ask GitHub for the latest
  // version number; if it is newer, reload from a fresh address (?v=N) that has never been saved.
  async function checkAppUpdate() {
    try {
      const html = await (await fetch('./?check=' + Date.now(), { cache: 'no-store' })).text();
      const v = +(html.match(/const VERSION = (\d+)/) || [])[1];
      if (v > VERSION && location.search !== '?v=' + v) location.replace('./?v=' + v);
    } catch {} // offline: try again next time
  }
  checkAppUpdate();
  const today = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD, local time; a function so it rolls over past midnight
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const $ = id => document.getElementById(id);

  // state = { tasks: [names], done: { 'YYYY-MM-DD': [names] } }
  let state = load('state', null);
  if (!state) { // carry over lists saved by the first version of the app
    const done = {};
    for (const k of Object.keys(localStorage)) if (k.startsWith('done-')) done[k.slice(5)] = load(k, []);
    state = { tasks: load('tasks', ['Drink water', 'Exercise', 'Read 10 pages']), done };
  }
  const doneToday = () => state.done[today()] || [];

  function change() {
    localStorage.setItem('state', JSON.stringify(state));
    localStorage.setItem('dirty', '1'); // has changes GitHub hasn't got yet
    render();
    schedulePush();
  }

  function render() {
    $('date').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
    const list = $('list');
    list.innerHTML = '';
    state.tasks.forEach(t => {
      const li = document.createElement('li');
      const isDone = doneToday().includes(t);
      li.className = isDone ? 'done' : '';
      li.innerHTML = '<label><input type="checkbox"><span></span></label><button aria-label="Delete">×</button>';
      li.querySelector('span').textContent = t; // textContent, so typed text can't inject HTML
      const box = li.querySelector('input');
      box.checked = isDone;
      box.onchange = () => {
        state.done[today()] = box.checked ? [...doneToday(), t] : doneToday().filter(x => x !== t);
        change();
      };
      // Tap once to arm, tap again to delete (pop-up confirm() is blocked in some browsers/app views).
      const del = li.querySelector('button');
      del.onclick = () => {
        if (del.textContent !== 'Delete?') { del.textContent = 'Delete?'; del.style.color = '#c0392b'; del.style.fontSize = '15px'; return; }
        state.tasks = state.tasks.filter(x => x !== t); change();
      };
      list.appendChild(li);
    });
    const n = state.tasks.filter(t => doneToday().includes(t)).length;
    $('progress').textContent = state.tasks.length ? `${n} of ${state.tasks.length} done` + (n === state.tasks.length ? ' 🎉' : '') : 'No tasks yet.';
  }

  $('add').onsubmit = e => {
    e.preventDefault();
    const t = $('name').value.trim();
    if (t && !state.tasks.includes(t)) { state.tasks.push(t); change(); }
    $('name').value = '';
  };

  // ---- Sync through a private GitHub Gist. Last save wins if both devices edit at the same moment. ----
  let token = localStorage.getItem('gh-token');
  let gistId = localStorage.getItem('gist-id');
  let pushTimer = null;

  function showSync(msg) {
    $('sync-status').textContent = token ? msg : 'Sync is off. Your list is saved on this device only.';
    $('connect').hidden = !!token;
    $('disconnect').hidden = !token;
  }

  async function gh(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' } });
    if (r.status === 401) throw new Error('GitHub did not accept the key (it may have expired). Turn off sync and connect with a new key.');
    if (r.status === 404 && path.startsWith('/gists/')) { gistId = null; localStorage.removeItem('gist-id'); }
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    return r.json();
  }

  async function findOrCreateGist() {
    const mine = await gh('/gists?per_page=100');
    const found = mine.find(g => g.files[FILE]);
    if (found) { localStorage.removeItem('dirty'); return found.id; } // joining an existing list: GitHub's copy wins
    const made = await gh('/gists', { method: 'POST', body: JSON.stringify({
      description: 'Daily checklist data', public: false, files: { [FILE]: { content: JSON.stringify(state) } } }) });
    localStorage.removeItem('dirty');
    return made.id;
  }

  async function pull() {
    if (!token || !navigator.onLine) return showSync('Offline. Changes will sync when you are back online.');
    try {
      showSync('Syncing…');
      if (!gistId) { gistId = await findOrCreateGist(); localStorage.setItem('gist-id', gistId); }
      if (localStorage.getItem('dirty')) return push(); // don't overwrite changes made offline
      const g = await gh('/gists/' + gistId);
      const remote = JSON.parse(g.files[FILE].content);
      if (!Array.isArray(remote.tasks) || typeof remote.done !== 'object') throw new Error('Saved data looks broken');
      state = remote;
      localStorage.setItem('state', JSON.stringify(state));
      render();
      showSync('Synced with GitHub ✓');
    } catch (e) { showSync('Sync problem: ' + e.message); }
  }

  async function push(keepalive = false) {
    clearTimeout(pushTimer); pushTimer = null;
    if (!token || !gistId) return pull();
    try {
      showSync('Saving…');
      await gh('/gists/' + gistId, { method: 'PATCH', keepalive,
        body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(state) } } }) });
      localStorage.removeItem('dirty');
      showSync('Synced with GitHub ✓');
    } catch (e) { showSync('Sync problem: ' + e.message); }
  }

  function schedulePush() { if (token) { clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); } }

  $('connect').onsubmit = e => {
    e.preventDefault();
    const t = $('token').value.trim();
    if (!t) return;
    token = t; localStorage.setItem('gh-token', t); $('token').value = '';
    pull();
  };
  $('disconnect').onclick = () => {
    token = gistId = null;
    localStorage.removeItem('gh-token'); localStorage.removeItem('gist-id');
    showSync();
  };

  // Re-sync whenever the app comes back on screen; save right away if it is being closed.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { render(); pull(); checkAppUpdate(); }
    else if (pushTimer) push(true);
  });
  window.addEventListener('online', pull);
  // Check for changes from other devices every 20 s while the app is on screen (~180 requests/hour, well under GitHub's 5000).
  setInterval(() => { if (token && document.visibilityState === 'visible' && !pushTimer) pull(); }, 20000);

  // Pull to refresh: drag down from the top of the page and let go to check for changes now.
  const ptr = $('ptr'), spin = ptr.firstElementChild;
  let startY = null;
  addEventListener('touchstart', e => { startY = scrollY <= 0 ? e.touches[0].clientY : null; ptr.style.transition = 'none'; }, { passive: true });
  addEventListener('touchmove', e => {
    if (startY === null) return;
    const d = Math.max(0, e.touches[0].clientY - startY);
    ptr.style.height = Math.min(d / 2, 70) + 'px';
    spin.style.transform = `rotate(${d * 2}deg)`;
  }, { passive: true });
  addEventListener('touchend', async () => {
    if (startY === null) return;
    startY = null; ptr.style.transition = ''; spin.style.transform = '';
    if (parseFloat(ptr.style.height) >= 60) {
      ptr.classList.add('loading'); ptr.style.height = '50px';
      await Promise.all([pull(), new Promise(r => setTimeout(r, 600))]); // keep the spinner visible long enough to see
      ptr.classList.remove('loading');
    }
    ptr.style.height = '0';
  });

  $('ver').textContent = VERSION;
  render();
  showSync('Syncing…');
  pull();
</script>
</body>
</html>
