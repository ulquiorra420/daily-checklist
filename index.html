<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><!-- stops iPhone auto-zooming into text boxes -->
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daily Checklist</title>
<style>
  :root { --bg:#f6f6f3; --card:#fff; --text:#222; --muted:#888; --accent:#2f7d5b; --danger:#c0392b; --sheet:#f6f6f3; --dim:rgba(0,0,0,.4); }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --card:#222; --text:#eee; --muted:#999; --accent:#5fc595; --danger:#e57366;
    --sheet:#323235; --dim:rgba(0,0,0,.65); } } /* --sheet: pop-ups, a lighter grey so they stand out from the page */
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0; font-size:26px; }
  h2 { font-size:17px; margin:24px 0 8px; }
  .row { display:flex; align-items:center; gap:8px; }
  .between { justify-content:space-between; }
  .muted { color:var(--muted); }
  #date, #progress { color:var(--muted); margin:4px 0 16px; }
  ul { list-style:none; padding:0; margin:0 0 16px; }
  li, .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:8px; }
  li { display:flex; align-items:center; gap:12px; }
  li label { flex:1; display:flex; gap:12px; align-items:center; cursor:pointer; min-width:0; }
  li label span { overflow-wrap:anywhere; }
  li input[type=checkbox] { width:22px; height:22px; flex:0 0 auto; accent-color:var(--accent); }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li button, .icon { background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; }
  .repeat { font-size:16px !important; opacity:.25; }
  .repeat[aria-pressed=true] { opacity:1; }
  .by { display:block; font-size:13px; color:var(--muted); }
  /* drag to reorder: hold ⠿ and move up or down */
  .handle { flex:0 0 auto; color:var(--muted); font-size:20px; line-height:1; padding:6px 2px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  li.dragging { box-shadow:0 6px 18px rgba(0,0,0,.3); position:relative; z-index:2; }
  body.dragging-list, body.dragging-list * { cursor:grabbing !important; user-select:none; -webkit-user-select:none; }
  .when { display:inline-block; color:var(--accent); font-size:15px; font-variant-numeric:tabular-nums; margin-right:6px; white-space:nowrap; }
  li.done .when { color:var(--muted); }
  /* For today / For later */
  .seg { display:flex; gap:0; margin:0 0 8px; border:1px solid var(--muted); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; padding:9px; border:0; background:var(--card); color:var(--text); font-size:15px; cursor:pointer; }
  .seg button[aria-pressed=true] { background:var(--accent); color:#fff; }
  #later-row { margin-top:8px; }
  #later-row input { padding:10px; }
  #upcoming li { gap:10px; }
  #upcoming .what { flex:1; min-width:0; overflow-wrap:anywhere; }
  #upcoming .muted { display:block; font-size:14px; margin-top:2px; } /* date and time on their own line, under the task */
  form { display:flex; gap:8px; }
  input, select, button, textarea { box-sizing:border-box; font-family:inherit; }
  input[type=text], input[type=password], input[type=time], input[type=date], select, textarea { flex:1; min-width:0; padding:12px; border-radius:10px; border:1px solid var(--muted); background:var(--card); color:var(--text); font-size:16px; }
  textarea { width:100%; resize:vertical; }
  button.main { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; }
  button.toggle { padding:0 12px; border:1px solid var(--muted); border-radius:10px; background:var(--card); font-size:18px; opacity:.4; cursor:pointer; }
  button.toggle[aria-pressed=true] { opacity:1; border-color:var(--accent); }
  .person { display:block; width:100%; text-align:left; font-size:20px; padding:18px; border:0; background:var(--card); color:var(--text); border-radius:12px; margin-bottom:10px; cursor:pointer; }
  #pin-input { display:block; width:100%; font-size:32px; letter-spacing:16px; text-align:center; }
  .msg { min-height:1.4em; color:var(--danger); }
  .card label { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0; }
  .card select, .card input[type=time] { flex:0 0 auto; padding:8px; }
  .card input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
  .link { background:none; border:0; padding:0; color:var(--accent); font-size:15px; cursor:pointer; text-decoration:underline; }
  .link.danger { color:var(--danger); }
  /* Notes: bullet points */
  #notes li, .day-notes li { display:list-item; list-style:disc inside; background:none; padding:4px 0; margin:0; }
  #notes li { display:flex; gap:8px; align-items:flex-start; }
  #notes li::before { content:'•'; color:var(--muted); }
  #notes li span { flex:1; white-space:pre-wrap; overflow-wrap:anywhere; cursor:text; }
  #notes li textarea { flex:1; }
  .day-notes li { white-space:pre-wrap; overflow-wrap:anywhere; }
  /* The Bar */
  #backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:10; }
  #bar { position:fixed; top:0; bottom:0; left:0; width:78%; max-width:320px; background:var(--bg); z-index:11; padding:24px 16px; box-sizing:border-box;
         transform:translateX(-105%); transition:transform .25s; box-shadow:2px 0 16px rgba(0,0,0,.2); }
  #bar.open { transform:none; }
  #bar button.item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; font-size:19px; padding:16px; border:0; background:var(--card); color:var(--text); border-radius:12px; margin-bottom:10px; cursor:pointer; }
  /* every icon gets the same fixed box, so the words line up whatever the emoji's size */
  #bar .ico { flex:0 0 28px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1; }
  /* Usage */
  .meter { height:14px; border-radius:7px; background:color-mix(in srgb, var(--muted) 25%, transparent); overflow:hidden; margin:12px 0 8px; }
  .meter > div { height:100%; background:var(--accent); min-width:3px; }
  .meter.full > div { background:var(--danger); }
  /* Help */
  .msg-card { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
  .msg-card .body { flex:1; min-width:0; }
  .msg-card .text { white-space:pre-wrap; overflow-wrap:anywhere; margin:4px 0 0; }
  .msg-card.solved .text { color:var(--muted); }
  .msg-card input[type=checkbox] { width:24px; height:24px; flex:0 0 auto; accent-color:var(--accent); margin-top:2px; }
  /* Archive */
  .day-btn { display:flex; justify-content:space-between; width:100%; text-align:left; font-size:17px; padding:14px; border:0; background:var(--card); color:var(--text); border-radius:12px; margin-bottom:8px; cursor:pointer; }
  .day-btn:disabled { opacity:.45; cursor:default; }
  .day-list li { gap:10px; }
  /* Pop-up */
  #modal, #assign { position:fixed; inset:0; background:var(--dim); z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; }
  #modal .box, #assign .box { background:var(--sheet); border:1px solid color-mix(in srgb, var(--muted) 30%, transparent); box-shadow:0 12px 40px rgba(0,0,0,.45); border-radius:16px; padding:20px; max-width:400px; width:100%; box-sizing:border-box; max-height:100%; overflow-y:auto; }
  /* For someone else */
  #assign form.box { display:block; } /* not the side-by-side layout other forms use */
  #assign-people { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 16px; }
  #assign-people button { padding:10px 14px; border:1px solid var(--muted); border-radius:20px; background:var(--card); color:var(--text); font-size:16px; cursor:pointer; }
  #assign-people button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  #assign .field { display:block; margin:0 0 12px; }
  #assign .field span { display:block; font-size:14px; color:var(--muted); margin-bottom:4px; }
  #assign .field input { width:100%; }
  button.wide { display:block; width:100%; padding:10px; margin:0 0 8px; border:1px solid var(--muted); border-radius:10px; background:var(--card); color:var(--text); font-size:15px; cursor:pointer; }
  /* Text size: Big */
  html.big body { zoom:1.25; }
  #modal ul { margin:12px 0; }
  #modal li { padding:10px 14px; }
  footer { margin-top:32px; font-size:14px; color:var(--muted); }
  footer p { margin:0 0 6px; }
  [hidden] { display:none !important; }
  #ptr { height:0; overflow:hidden; display:flex; justify-content:center; align-items:center; transition:height .2s; }
  #ptr .spin { width:24px; height:24px; border:3px solid var(--muted); border-top-color:var(--accent); border-radius:50%; }
  #ptr.loading .spin { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="ptr" aria-hidden="true"><div class="spin"></div></div>

<!-- The Bar (swipe right from the left edge, or tap ☰) -->
<div id="backdrop" hidden></div>
<nav id="bar" aria-label="Menu" hidden>
  <p class="muted" id="bar-who" style="margin:0 0 16px"></p>
  <button class="item" id="go-settings"><span class="ico" aria-hidden="true">⚙️</span><span data-t="settings"></span></button>
  <button class="item" id="go-archive"><span class="ico" aria-hidden="true">🗂️</span><span data-t="archive"></span></button>
  <button class="item" id="go-usage"><span class="ico" aria-hidden="true">📊</span><span data-t="usage"></span></button>
  <button class="item" id="go-help"><span class="ico" aria-hidden="true">💬</span><span data-t="help"></span></button>
</nav>

<!-- "Moved to today" pop-up -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="box">
    <h2 id="modal-title" style="margin-top:0"></h2>
    <p id="modal-text" class="muted" style="margin:0"></p>
    <ul id="modal-list"></ul>
    <button class="main" id="modal-ok" style="width:100%">OK</button>
  </div>
</div>

<!-- "For someone else" pop-up -->
<div id="assign" role="dialog" aria-modal="true" aria-labelledby="assign-title" hidden>
  <form class="box" id="assign-form">
    <h2 id="assign-title" style="margin-top:0" data-t="forOther"></h2>
    <p class="muted" style="margin:0" data-t="whoFor"></p>
    <div id="assign-people"></div>
    <label class="field"><span data-t="taskName"></span><input type="text" id="assign-text" maxlength="200"></label>
    <label class="field"><span data-t="date"></span><input type="date" id="assign-date"></label>
    <label class="field"><span data-t="time"></span><input type="time" id="assign-time"></label>
    <p class="muted" style="font-size:14px;margin:0 0 8px" data-t="assignHint"></p>
    <p class="msg" id="assign-msg" role="alert"></p>
    <div class="row" style="justify-content:flex-end;gap:16px">
      <button type="button" class="link" id="assign-cancel" data-t="cancel"></button>
      <button class="main" data-t="send"></button>
    </div>
  </form>
</div>

<main>
  <!-- 1. Who are you? -->
  <section id="pick" hidden>
    <h1>Who are you? · Bạn là ai?</h1>
    <p class="msg" id="pick-msg"></p>
    <div id="people"></div>
  </section>

  <!-- 2. PIN -->
  <section id="pin" hidden>
    <button class="link" id="pin-back"></button>
    <h1 id="pin-name" style="margin-top:16px"></h1>
    <p id="pin-title"></p>
    <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-labelledby="pin-title">
    <p class="msg" id="pin-msg" role="alert"></p>
  </section>

  <!-- 3. Today -->
  <section id="today" hidden>
    <div class="row">
      <button class="icon" id="open-bar" aria-label="Menu" style="color:var(--text)">☰</button>
      <h1 data-t="today"></h1>
    </div>
    <p id="date"></p>
    <ul id="list"></ul>
    <p id="progress"></p>
    <div class="seg" role="group">
      <button type="button" id="for-today" aria-pressed="true" data-t="forToday"></button>
      <button type="button" id="for-later" aria-pressed="false" data-t="forLater"></button>
    </div>
    <button type="button" class="wide" id="for-other"></button>
    <form id="add">
      <input id="name" type="text" required maxlength="200">
      <button type="button" class="toggle" id="add-repeat" aria-pressed="false">🔁</button>
      <button class="main" data-t="add"></button>
    </form>
    <div class="row" id="later-row" hidden>
      <input type="date" id="later-date" aria-label="Date">
      <input type="time" id="later-time" aria-label="Time">
    </div>
    <p class="muted" id="repeat-hint" style="font-size:14px;margin:6px 0 0"></p>

    <div id="upcoming-box" hidden>
      <h2 data-t="upcoming"></h2>
      <ul id="upcoming"></ul>
    </div>

    <h2 data-t="note"></h2>
    <form id="note-form" style="flex-direction:column">
      <textarea id="note-text" rows="2"></textarea>
      <button class="main" data-t="addNote" style="align-self:flex-end"></button>
    </form>
    <ul id="notes" style="margin-top:12px"></ul>
  </section>

  <!-- 4. Settings -->
  <section id="settings" hidden>
    <div class="row between">
      <h1 data-t="settings"></h1>
      <button class="main" id="close-settings" data-t="done"></button>
    </div>
    <p class="muted" id="settings-who"></p>

    <h2 data-t="language"></h2>
    <div class="card"><label><span data-t="language"></span>
      <select id="set-lang"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label></div>

    <h2 data-t="textSize"></h2>
    <div class="card"><label><span data-t="textSize"></span>
      <select id="set-size"><option value="standard"></option><option value="big"></option></select></label></div>

    <h2 data-t="notifications"></h2>
    <div class="card">
      <p id="notif-status" class="muted" style="margin:0 0 8px"></p>
      <button class="main" id="notif-on" data-t="notifOn"></button>
    </div>

    <h2 data-t="water"></h2>
    <div class="card">
      <label><span data-t="on"></span><input type="checkbox" id="w-on"></label>
      <label><span data-t="every"></span><select id="w-every"></select></label>
      <label><span data-t="from"></span><select id="w-from"></select></label>
      <label><span data-t="to"></span><select id="w-to"></select></label>
    </div>

    <h2 data-t="morning"></h2>
    <div class="card">
      <label><span data-t="on"></span><input type="checkbox" id="m-on"></label>
      <label><span data-t="at"></span><input type="time" id="m-time"></label>
    </div>

    <h2 data-t="summary"></h2>
    <div class="card">
      <label><span data-t="on"></span><input type="checkbox" id="s-on"></label>
      <label><span data-t="at"></span><input type="time" id="s-time"></label>
    </div>
    <p class="msg" id="settings-msg"></p>

    <div id="admin" hidden>
      <h2 data-t="admin"></h2>
      <div class="card">
        <div id="admin-people"></div>
        <form id="admin-add" style="margin-top:12px">
          <input id="admin-name" type="text" maxlength="30" required>
          <select id="admin-lang" style="flex:0 0 auto"><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
          <button class="main" data-t="add"></button>
        </form>
        <p class="msg" id="admin-msg"></p>
      </div>
    </div>

    <p style="margin-top:24px"><button class="link" id="switch" data-t="switchPerson"></button></p>
  </section>

  <!-- 5. Archive: list of past days -->
  <section id="archive" hidden>
    <button class="link back-today" data-t="backToday"></button>
    <h1 data-t="archive" style="margin:16px 0"></h1>
    <p class="msg" id="archive-msg"></p>
    <div id="archive-list"></div>
  </section>

  <!-- 6. Archive: one day -->
  <section id="archive-day" hidden>
    <button class="link" id="back-archive" data-t="backArchive"></button>
    <h1 id="day-title" style="margin:16px 0 4px"></h1>
    <p class="muted" id="day-summary" style="margin:0 0 16px"></p>
    <ul class="day-list" id="day-tasks"></ul>
    <h2 data-t="note" id="day-notes-title"></h2>
    <ul class="day-notes" id="day-notes"></ul>
    <p class="muted" id="day-legacy" style="font-size:14px" data-t="legacy"></p>
  </section>

  <!-- 7. Usage -->
  <section id="usage" hidden>
    <button class="link back-today" data-t="backToday"></button>
    <h1 data-t="usage" style="margin:16px 0"></h1>
    <div class="card">
      <div class="meter" id="usage-meter"><div></div></div>
      <p id="usage-text" style="margin:0"></p>
    </div>
    <p class="muted" style="font-size:14px" data-t="usageInfo"></p>
  </section>

  <!-- 8. Help -->
  <section id="help" hidden>
    <button class="link back-today" data-t="backToday"></button>
    <h1 data-t="help" style="margin:16px 0"></h1>
    <form id="help-form" style="flex-direction:column">
      <label for="help-text" data-t="helpPrompt"></label>
      <textarea id="help-text" rows="4" maxlength="2000"></textarea>
      <button class="main" data-t="send" style="align-self:flex-end"></button>
    </form>
    <p class="msg" id="help-msg" role="status"></p>
    <h2 id="help-list-title"></h2>
    <div id="help-list"></div>
  </section>

  <footer>
    <p id="sync-status"></p>
    <p><span data-t="version"></span> <span id="ver"></span> · <span data-t="pullHint"></span></p>
  </footer>
</main>
<script>
  const VERSION = 14; // whole number, bump on every release so installed copies update themselves (older copies only read whole numbers)
  const VERSION_NAME = '13.1'; // what the footer shows
  const API = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://daily-checklist.danganhle99.workers.dev';

  // Home Screen apps can keep an old copy of this page for a long time. Ask GitHub for the latest
  // version number; if it is newer, reload from a fresh address (?v=N) that has never been saved.
  async function checkAppUpdate() {
    try {
      const html = await (await fetch('./?check=' + Date.now(), { cache: 'no-store' })).text();
      const v = +(html.match(/const VERSION = (\d+)/) || [])[1];
      if (v > VERSION && location.search !== '?v=' + v) location.replace('./?v=' + v);
    } catch {} // offline: try again next time
  }
  checkAppUpdate();

  const T = {
    en: {
      today: 'Today', add: 'Add', addPlaceholder: 'Add a task…', del: 'Delete?', sure: 'Sure?',
      progress: (n, t) => `${n} of ${t} done`, noTasks: 'No tasks yet.',
      repeat: 'Repeat daily', repeatOn: '🔁 This task will come back every day.', repeatOff: 'Tap 🔁 to make a task repeat every day.',
      note: 'Note', notePlaceholder: 'Write a note…', addNote: 'Add note', save: 'Save',
      settings: 'Settings', archive: 'Archive', backToday: '← Today', backArchive: '← Archive',
      noPast: 'No past days yet.', nothing: 'Nothing recorded', finished: 'Finished', notFinished: 'Not finished',
      dayCount: (n, t) => `${n}/${t} done`, notesCount: n => `📝 ${n}`, legacy: 'Before version 9, only finished tasks were recorded.',
      movedTitle: (from, y) => from === y ? 'Not finished yesterday' : `Not finished on ${from}`, movedText: 'These were moved to today:',
      enterPin: 'Enter your PIN', choosePin: 'Choose a 4-digit PIN', againPin: 'Type the same PIN again',
      pinMismatch: "The PINs didn't match. Try again.", wrongPin: n => `Wrong PIN. ${n} ${n === 1 ? 'try' : 'tries'} left.`,
      locked: m => `Too many wrong tries. Try again in ${m} minutes.`, back: '← Back',
      done: 'Done', language: 'Language', notifications: 'Notifications',
      notifOn: 'Turn on notifications', notifEnabled: 'Notifications are on for this device ✓', notifOff: 'Notifications are off on this device.',
      notifNeedsHome: 'To get notifications on iPhone, open the app from its Home Screen icon (iOS 16.4 or newer).',
      notifDenied: 'Notifications are blocked. Turn them on in iPhone Settings → Notifications → Daily Checklist.',
      notifError: 'Could not turn on notifications. Try again.',
      water: 'Water reminder', on: 'On', every: 'Every', minutes: 'min', from: 'From', to: 'Until',
      morning: 'Morning reminder (unfinished from yesterday)', summary: '"Still to do" reminder', at: 'At', switchPerson: 'Switch person',
      admin: 'Family (admin)', resetPin: 'Reset PIN', resetDone: n => `${n} will choose a new PIN next time.`, remove: 'Remove',
      namePlaceholder: 'Name', nameTaken: 'That name is already used.', fromTo: '"From" must be earlier than "Until".',
      offline: 'Offline. Changes will sync when you are back online.', syncing: 'Syncing…', synced: 'Saved ✓',
      syncProblem: 'Could not reach the server. Will try again.', version: 'App version', pullHint: 'pull down to check for changes',
      signedInAs: n => `Signed in as ${n}`, starter: 'Drink water',
      usage: 'Usage', usageText: (u, l, p) => `${u} of ${l} used (${p}%)`, usageShort: (u, p) => `${u} (${p}%)`,
      usageInfo: 'Your lists, notes and Help messages are saved on the server. Each person has 5 MB, which is enough for many years of daily lists.',
      storageFull: 'Storage full: nothing new can be saved. Please tell dannyle.',
      help: 'Help', helpPrompt: 'Has any problem occurred, or would you like anything changed in this app?', send: 'Send',
      helpSent: 'Sent ✓ dannyle will see it.', helpYours: 'Your messages', helpAll: 'Messages from family', helpNone: 'No messages yet.',
      waiting: 'Waiting', solved: '✅ Solved', markSolved: 'Solved',
      forToday: 'For today', forLater: 'For later', upcoming: 'Upcoming',
      laterHint: '⏰ You will get a notification at this time, then every 15 minutes until you tick it off (until midnight). On that day it joins your list.',
      needWhen: 'Choose a date and a time.', pastWhen: 'That time has already passed.', tooMany: 'Too many planned tasks.',
      textSize: 'Text size', big: 'Big', standard: 'Standard', drag: 'Hold and drag to move',
      forOther: '👤 For someone else', whoFor: 'Who is it for?', taskName: 'Task', date: 'Date', time: 'Time', cancel: 'Cancel',
      assignHint: '⏰ Their phone gets a notification at this time, then every 15 minutes until they tick it off (until midnight).',
      pickPerson: 'Choose who it is for.', needText: 'Write the task.', addedBy: n => `Added by ${n}`, forName: n => `Sent to ${n}`,
      assignSent: n => `Sent to ${n} ✓`,
    },
    vi: {

    if (r.status === 401 && data.error === 'signed-out') { signOut(); throw Object.assign(new Error('signed-out'), { data }); }

  // ---------- days ----------
  // Same rule as newDay() in server/index.js (keep in sync): finished one-time tasks stay behind in the
  // Archive; unfinished and repeat-daily tasks come to the new day unticked; notes start empty.
  function newDay(all, date) {
    const prevKey = Object.keys(all).filter(d => d < date).sort().pop();
    const prev = all[prevKey];
    if (!prev) return { tasks: [], notes: [], carried: [] };
    return {
      tasks: prev.tasks.filter(x => !x.done || x.repeat).map(x => ({ text: x.text, done: false, repeat: x.repeat })),
      notes: [],
      carried: prev.tasks.filter(x => !x.done).map(x => x.text),
      from: prevKey,
    };
  }
  function todayDay() {
    const d = today();
    if (!days[d]) {
      days[d] = newDay(days, d);
      if (serverEmpty && !days[d].tasks.length) days[d].tasks.push({ text: t('starter'), done: false, repeat: true });
      const keep = Object.keys(days).sort().slice(-2); // older days live on the server (Archive)
      days = Object.fromEntries(keep.map(k => [k, days[k]]));
      markDirty(d);
    }
    return days[d];
  }
  function markDirty(d) {
    localStorage.setItem('days', JSON.stringify(days));

  // ---------- 3. today ----------

    day.tasks.forEach(task => {
      const li = document.createElement('li');

      li.innerHTML = '<span class="handle">⠿</span><label><input type="checkbox"><span></span></label><button class="repeat"></button><button aria-label="Delete">×</button>';

  // ---------- drag to reorder ----------
  // Hold ⠿ and move: the task swaps places with the one under your finger; the new order is saved on release.
  // (Listens on the whole window: moving the row in the page would otherwise lose track of the finger.)
  function startDrag(e, li, day) {
    e.preventDefault();
    const id = e.pointerId;
    li.classList.add('dragging'); document.body.classList.add('dragging-list');

      if (ev.pointerId !== id) return;
      const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('#list > li');
      if (!under || under === li) return;
      const items = [...$('list').children];
      $('list').insertBefore(li, items.indexOf(under) > items.indexOf(li) ? under.nextSibling : under);
      if (navigator.vibrate) navigator.vibrate(5);

      if (ev.pointerId !== id) return;

      if (order.some((x, i) => x !== day.tasks[i])) { day.tasks = order; change(); }
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', end);
    addEventListener('pointercancel', end);
  }

    const day = todayDay();

    const ul = $('notes');
    ul.textContent = '';
    day.notes.forEach((note, i) => {
      const li = document.createElement('li');
      if (i === editingNote) {
        li.innerHTML = '<textarea rows="3"></textarea><button class="main"></button>';
        const ta = li.querySelector('textarea'), save = li.querySelector('button');
        ta.value = note; save.textContent = t('save');
        save.onclick = () => {
          const v = ta.value.trim();
          if (v) day.notes[i] = v; else day.notes.splice(i, 1);
          editingNote = -1; change();
        };
        ul.appendChild(li); ta.focus();
        return;
      }
      li.innerHTML = '<span></span><button aria-label="Delete">×</button>';
      const span = li.querySelector('span');
      span.textContent = note;
      span.onclick = () => { editingNote = i; renderNotes(day); };
      armedButton(li.querySelector('button'), t('del'), () => { day.notes.splice(i, 1); editingNote = -1; change(); });
      ul.appendChild(li);
    });
  }
  $('note-form').onsubmit = e => {
    e.preventDefault();
    const v = $('note-text').value.trim();
    if (v) { todayDay().notes.push(v); $('note-text').value = ''; editingNote = -1; change(); }
  };

  // "Moved to today" pop-up: the first time the app is opened each day.
  function maybePopup() {
    const d = today(), day = days?.[d];
    if (!day?.carried?.length || popupShown === d || current() !== 'today' || !$('modal').hidden) return;
    $('modal-title').textContent = t('movedTitle')(day.from, addDays(d, -1));
    $('modal-text').textContent = t('movedText');
    $('modal-list').textContent = '';
    for (const x of day.carried) { const li = document.createElement('li'); li.textContent = x; $('modal-list').appendChild(li); }
    $('modal').hidden = false;
    $('modal-ok').focus();
  }
  $('modal-ok').onclick = () => {
    $('modal').hidden = true;
    popupShown = today(); localStorage.setItem('popupShown', JSON.stringify(popupShown));
    api('/popup', 'PUT', { date: popupShown }).catch(() => {});
  };

  // ---------- sync ----------
  async function pull() {
    if (!token) return;
    if (!navigator.onLine) return status(t('offline'));
    try {
      if (load('dirty', null)) { await push(); if (load('dirty', null)) return; } // don't overwrite changes made offline
      const r = await api('/me');
      if (!r.recent) throw new Error('old-server');
      me = { id: r.id, name: r.name, isAdmin: r.isAdmin, settings: r.settings };
      days = r.recent;
      serverEmpty = !Object.keys(days).length;
      popupShown = r.popupShown;
      savePlans(r.plans || []);
      applyTextSize(me.settings.textSize || 'standard');
      localStorage.setItem('me', JSON.stringify(me));
      localStorage.setItem('days', JSON.stringify(days));
      localStorage.setItem('popupShown', JSON.stringify(popupShown));
      if (me.settings.tz !== deviceTz) saveSettings({ tz: deviceTz }); // reminders follow this phone's time zone
      if (lang !== me.settings.lang) { lang = me.settings.lang; translate(); }
      $('bar-who').textContent = t('signedInAs')(me.name);
      const screen = current();
      if (screen === 'pick' || screen === 'pin' || !screen) show('today');
      movePlans();
      if (current() === 'today' && editingNote < 0 && document.activeElement?.id !== 'note-text' && !document.body.classList.contains('dragging-list')) renderToday(); else todayDay();
      maybePopup();
      status(t('synced'));
    } catch (e) { if (e.message !== 'signed-out') status(t('syncProblem')); }
  }
  async function push() {
    clearTimeout(pushTimer); pushTimer = null;
    const date = load('dirty', null);
    if (!token || !date || !days?.[date]) return;
    try {
      status(t('syncing'));
      await api('/day', 'PUT', { date, day: days[date] });
      if (load('dirty', null) === date && !pushTimer) localStorage.removeItem('dirty');
      status(t('synced'));
    } catch (e) {
      if (e.message === 'day-is-archived') { localStorage.removeItem('dirty'); return pull(); } // another phone already moved on
      status(e.message === 'storage-full' ? t('storageFull') : navigator.onLine ? t('syncProblem') : t('offline'));
    }
  }

  // ---------- The Bar ----------
  function openBar() {
    if (!me || ['pick', 'pin'].includes(current())) return;
    $('bar-who').textContent = t('signedInAs')(me.name);
    $('bar').hidden = false; $('backdrop').hidden = false;
    void $('bar').offsetWidth; // let the browser place it off-screen first, so it slides in
    $('bar').classList.add('open');
  }
  function closeBar() {
    $('bar').classList.remove('open'); $('backdrop').hidden = true;
    setTimeout(() => { if (!$('bar').classList.contains('open')) $('bar').hidden = true; }, 250);
  }
  $('open-bar').onclick = openBar;
  $('backdrop').onclick = closeBar;
  $('go-settings').onclick = () => { renderSettings(); show('settings'); };
  $('go-archive').onclick = showArchive;
  $('go-usage').onclick = showUsage;
  $('go-help').onclick = showHelp;

  // ---------- 7. Usage ----------
  async function showUsage() {
    show('usage');
    $('usage-text').textContent = t('syncing');
    try {
      const { used, limit } = await api('/usage');
      $('usage-meter').firstElementChild.style.width = Math.min(100, used / limit * 100) + '%';
      $('usage-meter').classList.toggle('full', used >= limit * 0.9);
      $('usage-text').textContent = t('usageText')(fmtBytes(used), fmtBytes(limit), pct(used, limit));
    } catch { $('usage-text').textContent = navigator.onLine ? t('syncProblem') : t('offline'); }
  }

  // ---------- 8. Help ----------
  // Everyone sends messages and sees their own; the admin sees everyone's and ticks them solved.
  async function showHelp() {
    show('help');
    $('help-form').hidden = me.isAdmin;
    $('help-list-title').textContent = t(me.isAdmin ? 'helpAll' : 'helpYours');
    await renderHelp();
  }
  async function renderHelp() {
    const box = $('help-list');
    let msgs;
    try { msgs = await api('/help'); } catch { $('help-msg').textContent = navigator.onLine ? t('syncProblem') : t('offline'); return; }
    box.textContent = '';
    if (!msgs.length) { box.textContent = t('helpNone'); return; }
    for (const m of msgs) {
      const card = document.createElement('div');
      card.className = 'msg-card' + (m.solved ? ' solved' : '');
      card.innerHTML = '<div class="body"><div class="muted" style="font-size:14px"></div><p class="text"></p></div>';
      const when = new Date(m.created).toLocaleString(lang === 'vi' ? 'vi-VN' : 'en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      card.querySelector('.muted').textContent = (me.isAdmin ? m.name + ' · ' : '') + when + (me.isAdmin ? '' : ' · ' + t(m.solved ? 'solved' : 'waiting'));
      card.querySelector('.text').textContent = m.text;
      if (me.isAdmin) {
        const box2 = document.createElement('input');
        box2.type = 'checkbox'; box2.checked = m.solved; box2.setAttribute('aria-label', t('markSolved'));
        box2.onchange = async () => {
          try { await api('/admin/help-solved', 'POST', { id: m.id, solved: box2.checked }); } catch { box2.checked = !box2.checked; }
          renderHelp();
        };
        card.prepend(box2);
      }
      box.appendChild(card);
    }
  }
  $('help-form').onsubmit = async e => {
    e.preventDefault();
    const text = $('help-text').value.trim();
    if (!text) return;
    try {
      await api('/help', 'POST', { text });
      $('help-text').value = ''; $('help-msg').textContent = t('helpSent');
      renderHelp();
    } catch (err) { $('help-msg').textContent = err.message === 'storage-full' ? t('storageFull') : navigator.onLine ? t('syncProblem') : t('offline'); }
  };

  // ---------- 5/6. Archive ----------
  async function showArchive() {
    show('archive');
    const box = $('archive-list');
    box.textContent = ''; $('archive-msg').textContent = '';
    let summary;
    try { summary = await api('/archive'); } catch { $('archive-msg').textContent = navigator.onLine ? t('syncProblem') : t('offline'); return; }
    const dates = Object.keys(summary).sort(), last = addDays(today(), -1);
    if (!dates.length || dates[0] > last) { box.textContent = t('noPast'); return; }
    for (let d = last; d >= dates[0]; d = addDays(d, -1)) {
      const s = summary[d], b = document.createElement('button');
      b.className = 'day-btn';
      b.innerHTML = '<span></span><span class="muted"></span>';
      b.firstChild.textContent = fmtDate(d, { weekday: 'short', month: 'short', day: 'numeric' });
      b.lastChild.textContent = s ? [s.total && t('dayCount')(s.done, s.total), s.notes && t('notesCount')(s.notes)].filter(Boolean).join(' · ') : t('nothing');
      if (s) b.onclick = () => showArchiveDay(d); else b.disabled = true;
      box.appendChild(b);
    }
  }
  async function showArchiveDay(d) {
    let day;
    try { day = await api('/archive/day?date=' + d); } catch { $('archive-msg').textContent = t('syncProblem'); return; }
    show('archive-day');
    $('day-title').textContent = fmtDate(d);
    const n = day.tasks.filter(x => x.done).length;
    $('day-summary').textContent = day.tasks.length ? t('dayCount')(n, day.tasks.length) : '';
    const ul = $('day-tasks'); ul.textContent = '';
    for (const x of day.tasks) {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><span style="flex:1"></span><span class="muted" style="font-size:14px"></span>';
      li.children[0].textContent = x.done ? '✅' : '❌';
      li.children[1].textContent = (x.time ? '⏰ ' + x.time + ' ' : '') + x.text + (x.repeat ? ' 🔁' : '') + (x.by ? ' · ' + t('addedBy')(x.by) : '');
      li.children[2].textContent = x.done ? t('finished') : t('notFinished');
      ul.appendChild(li);
    }
    const notes = $('day-notes'); notes.textContent = '';
    for (const x of day.notes) { const li = document.createElement('li'); li.textContent = x; notes.appendChild(li); }
    $('day-notes-title').hidden = !day.notes.length;
    $('day-legacy').hidden = !day.legacy;
  }
  document.querySelectorAll('.back-today').forEach(b => b.onclick = () => { renderToday(); show('today'); });
  $('back-archive').onclick = showArchive;

  // ---------- 4. settings ----------
  const hh = h => String(h).padStart(2, '0') + ':00';
  for (const m of [15, 30, 45, 60, 90, 120]) $('w-every').add(new Option(m, m));
  for (let h = 0; h < 24; h++) { $('w-from').add(new Option(hh(h), h)); $('w-to').add(new Option(hh(h), h)); }

  function renderSettings() {
    const s = me.settings;
    $('settings-who').textContent = t('signedInAs')(me.name);
    $('set-lang').value = s.lang;
    $('set-size').value = s.textSize || 'standard';
    $('w-on').checked = s.water.on; $('w-every').value = s.water.every; $('w-from').value = s.water.from; $('w-to').value = s.water.to;
    [...$('w-every').options].forEach(o => o.text = `${o.value} ${t('minutes')}`);
    $('m-on').checked = s.morning.on; $('m-time').value = s.morning.time;
    $('s-on').checked = s.summary.on; $('s-time').value = s.summary.time;
    renderNotifStatus();
    $('admin').hidden = !me.isAdmin;
    if (me.isAdmin) renderAdmin();
  }
  async function saveSettings(change) {
    try {
      me.settings = await api('/settings', 'PUT', { settings: change });
      localStorage.setItem('me', JSON.stringify(me));
      $('settings-msg').textContent = '';
    } catch { $('settings-msg').textContent = navigator.onLine ? t('syncProblem') : t('offline'); }
  }
  $('close-settings').onclick = () => { renderToday(); show('today'); };
  // Text size is saved with the person (so it follows them to another phone) and on this phone (so it applies before sign-in).
  function applyTextSize(size) {
    document.documentElement.classList.toggle('big', size === 'big');
    try { localStorage.setItem('textSize', size); } catch {}
  }
  $('set-size').onchange = async () => { applyTextSize($('set-size').value); await saveSettings({ textSize: $('set-size').value }); renderSettings(); };
  $('set-lang').onchange = async () => { await saveSettings({ lang: $('set-lang').value }); lang = me.settings.lang; translate(); renderSettings(); };
  const saveWater = async () => {
    const from = +$('w-from').value, to = +$('w-to').value;
    if (from >= to) { $('settings-msg').textContent = t('fromTo'); return renderSettings(); }
    await saveSettings({ water: { on: $('w-on').checked, every: +$('w-every').value, from, to } }); renderSettings();
  };
  ['w-on', 'w-every', 'w-from', 'w-to'].forEach(id => $(id).onchange = saveWater);
  for (const [k, on, time] of [['summary', 's-on', 's-time'], ['morning', 'm-on', 'm-time']]) {
    const save = async () => { await saveSettings({ [k]: { on: $(on).checked, time: $(time).value } }); renderSettings(); };
    $(on).onchange = save; $(time).onchange = save;
  }
  $('switch').onclick = async () => {
    try { const sub = await (await navigator.serviceWorker?.getRegistration())?.pushManager.getSubscription(); await sub?.unsubscribe(); } catch {}
    try { await api('/logout', 'POST'); } catch {}
    signOut();
  };

  // ---------- notifications ----------
  const canPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  function renderNotifStatus() {
    const s = $('notif-status'), b = $('notif-on');
    if (!canPush()) { s.textContent = t('notifNeedsHome'); b.hidden = true; return; }
    if (Notification.permission === 'denied') { s.textContent = t('notifDenied'); b.hidden = true; return; }
    const on = localStorage.getItem('notif') === me.id && Notification.permission === 'granted';
    s.textContent = on ? t('notifEnabled') : t('notifOff');
    b.hidden = on;
  }
  async function subscribe(test) {
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const { key } = await api('/vapid');
    const raw = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
    await api('/subscribe', 'POST', { subscription: sub.toJSON(), test });
    localStorage.setItem('notif', me.id);
  }
  $('notif-on').onclick = async () => {
    try {
      if (await Notification.requestPermission() !== 'granted') return renderNotifStatus();
      await subscribe(true); // the server sends a test notification
    } catch { $('notif-status').textContent = t('notifError'); return; }
    renderNotifStatus();
  };
  // After switching person on a phone that already allows notifications, send reminders to the new person.
  async function relinkNotifications() {
    if (canPush() && Notification.permission === 'granted' && localStorage.getItem('notif') && me) {
      try { await subscribe(false); } catch {}
    }
  }

  // ---------- admin ----------
  async function renderAdmin() {
    const box = $('admin-people');
    let usage;
    try { [people, usage] = await Promise.all([api('/people'), api('/admin/usage')]); } catch { return; }
    box.textContent = '';
    for (const p of people) {
      const row = document.createElement('div');
      row.className = 'row between'; row.style.margin = '8px 0';
      row.innerHTML = '<span><span></span> <span class="muted" style="font-size:14px"></span></span><span class="row" style="gap:16px"><button class="link"></button><button class="link danger"></button></span>';
      const [nameEl, useEl] = row.firstChild.children;
      nameEl.textContent = p.name;
      const used = usage.people[p.id] || 0;
      useEl.textContent = t('usageShort')(fmtBytes(used), pct(used, usage.limit));
      const [reset, remove] = row.querySelectorAll('button');
      reset.textContent = t('resetPin');
      armedButton(reset, t('sure'), async () => { await api('/admin/reset-pin', 'POST', { id: p.id }); $('admin-msg').textContent = t('resetDone')(p.name); renderAdmin(); });
      if (p.id === me.id) remove.remove();
      else { remove.textContent = t('remove'); armedButton(remove, t('sure'), async () => { await api('/admin/people', 'DELETE', { id: p.id }); renderAdmin(); }); }
      box.appendChild(row);
    }
  }
  $('admin-add').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('/admin/people', 'POST', { name: $('admin-name').value.trim(), lang: $('admin-lang').value });
      $('admin-name').value = ''; $('admin-msg').textContent = ''; renderAdmin();
    } catch (err) { $('admin-msg').textContent = err.message === 'name-taken' ? t('nameTaken') : t('syncProblem'); }
  };

  // ---------- refresh: every 60 s while open, every time the app is reopened, and pull-to-refresh ----------
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { pull(); checkAppUpdate(); }
    else if (pushTimer) push();
  });
  window.addEventListener('online', pull);
  setInterval(() => { if (token && document.visibilityState === 'visible' && !pushTimer) pull(); }, 60000);

  // Touch: swipe right from the left edge opens The Bar, swipe left closes it; pull down from the top refreshes.
  const ptr = $('ptr'), spin = ptr.firstElementChild;
  let touch = null;
  addEventListener('touchstart', e => {
    if (e.target.closest?.('.handle, #assign') || !$('assign').hidden) { touch = null; return; }
    const p = e.touches[0];
    touch = { x: p.clientX, y: p.clientY, dx: 0, dy: 0, mode: null, top: scrollY <= 0 };
    ptr.style.transition = 'none';
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (!touch) return;
    const p = e.touches[0];
    touch.dx = p.clientX - touch.x; touch.dy = p.clientY - touch.y;
    if (!touch.mode && Math.hypot(touch.dx, touch.dy) > 10) touch.mode = Math.abs(touch.dx) > Math.abs(touch.dy) ? 'side' : 'down';
    if (touch.mode === 'down' && touch.top && $('bar').hidden) {
      const d = Math.max(0, touch.dy);
      ptr.style.height = Math.min(d / 2, 70) + 'px';
      spin.style.transform = `rotate(${d * 2}deg)`;
    }
  }, { passive: true });
  addEventListener('touchend', async () => {
    if (!touch) return;
    const { mode, dx, x } = touch; touch = null;
    ptr.style.transition = ''; spin.style.transform = '';
    if (mode === 'side') {
      if ($('bar').hidden && x < 40 && dx > 60) openBar();
      else if (!$('bar').hidden && dx < -60) closeBar();
    }
    if (parseFloat(ptr.style.height) >= 60) {
      ptr.classList.add('loading'); ptr.style.height = '50px';
      await Promise.all([pull(), checkAppUpdate(), new Promise(r => setTimeout(r, 600))]); // keep the spinner visible long enough to see
      ptr.classList.remove('loading');
    }
    ptr.style.height = '0';
  });

  // ---------- start ----------
  try { applyTextSize(localStorage.getItem('textSize') === 'big' ? 'big' : 'standard'); } catch {}
  translate();
  navigator.serviceWorker?.getRegistration().then(r => r?.update()).catch(() => {}); // pick up a new sw.js (notification grouping)
  if (token && me && days) { show('today'); renderToday(); maybePopup(); pull(); }
  else if (token) pull();
  else showPick();
</script>
</body>
</html>
